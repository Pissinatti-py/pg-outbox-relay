[package]
name = "pg-outbox-relay"
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
description = "Reliable event publishing from PostgreSQL to message brokers, without dual writes"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-sns = "1.115.0"
aws-sdk-sqs = "1.113.0"
axum = "0.8.9"
config = { version = "0.15.26", default-features = false, features = ["toml"] }
fastrand = "2.5.0"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
percent-encoding = "2.3.2"
pgwire-replication = "0.4.1"
redis = { version = "1.7.1", default-features = false, features = ["streams", "connection-manager", "tokio-rustls-comp"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
tokio-postgres = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"

[dev-dependencies]
testcontainers-modules = { version = "0.15", features = ["postgres", "elasticmq", "redis"] }
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bench]]
name = "relay"
harness = false
