# Alert rules for pg-outbox-relay. Tune the thresholds to your traffic and to
# Postgres' max_slot_wal_keep_size (the slot is invalidated past that size).
groups:
  - name: pg-outbox-relay
    rules:
      - alert: OutboxSlotLagHigh
        expr: pg_outbox_slot_lag_bytes > 512 * 1024 * 1024
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Replication slot of {{ $labels.source }} holds {{ $value | humanize1024 }}B of WAL"
          description: >-
            The relay is behind or stuck (check pg_outbox_publish_errors_total).
            Postgres keeps this WAL until the relay acknowledges it.

      - alert: OutboxRelayDown
        # While the relay is down its own lag metric vanishes, but the slot keeps growing.
        expr: up{job="relay"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "pg-outbox-relay is down; the replication slot is growing"

      - alert: OutboxSourceDown
        # Two replicas share the slots: a source is fine while either of them streams it.
        expr: sum by (source) (pg_outbox_source_up) == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No relay streams {{ $labels.source }}"
          description: >-
            Its database is down, its slot is missing, or its pipeline keeps failing (see the
            relay's ERROR logs). An existing slot keeps WAL meanwhile, though its lag reads 0 while
            no relay streams it. A missing slot keeps nothing: events committed before it is
            created are never relayed.

      - alert: OutboxPublishStalled
        expr: >-
          sum by (source) (increase(pg_outbox_publish_errors_total{kind="retryable"}[5m])) > 0
          and sum by (source) (increase(pg_outbox_events_published_total[5m])) == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The broker rejects every publish of {{ $labels.source }}; its events are waiting in the WAL"

      - alert: OutboxPoisonEvents
        expr: increase(pg_outbox_dead_letters_total[15m]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "Events of {{ $labels.source }} were rejected permanently and skipped"
          description: "Their envelopes and the broker's reasons are in the outbox_dead_letter table."
